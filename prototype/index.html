<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>skill-map プロトタイプ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>skill-map</h1>
    <p class="proto-note">プロトタイプ(データはこのブラウザの中だけに保存されます)</p>
    <button type="button" class="reset-btn" id="reset-btn">サンプルデータに戻す</button>
  </header>

  <p class="storage-warning" id="storage-warning" hidden>
    このブラウザでは、データを保存できません。画面を閉じたり再読み込みしたりすると、変更が消えます。
  </p>

  <!-- ボード(3つの列は、app.js が描画する) -->
  <main class="board" id="board" aria-label="スキルボード"></main>

  <!-- スキルの追加・編集フォーム -->
  <dialog id="skill-dialog" aria-labelledby="skill-dialog-title">
    <form class="dialog-body" id="skill-form" novalidate>
      <h2 id="skill-dialog-title">スキルを追加</h2>

      <div class="field">
        <label for="f-name">スキル名 <em>必須</em></label>
        <input type="text" id="f-name" name="name" maxlength="100" autocomplete="off" placeholder="例: レジ締め">
        <p class="error" id="err-name" role="alert"></p>
      </div>

      <div class="row">
        <div class="field">
          <label for="f-priority">優先度</label>
          <select id="f-priority" name="priority">
            <option value="high">高</option>
            <option value="medium">中</option>
            <option value="low">低</option>
          </select>
          <p class="error" id="err-priority" role="alert"></p>
        </div>
        <div class="field">
          <label for="f-due">期限</label>
          <input type="date" id="f-due" name="dueDate">
          <p class="error" id="err-due" role="alert"></p>
        </div>
      </div>

      <div class="field">
        <label for="f-note">ポイント・考察</label>
        <textarea id="f-note" name="note" rows="4" maxlength="5000"></textarea>
        <p class="error" id="err-note" role="alert"></p>
      </div>

      <!-- 習得日は、習得済みのスキルを編集するときだけ表示する(編集はできない) -->
      <p class="readonly" id="acquired-row" hidden>
        習得日: <span id="acquired-value"></span>
        (自動で記録されるため、編集できません)
      </p>

      <div class="actions">
        <button type="button" class="btn" id="skill-cancel">キャンセル</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 確認ダイアログ(スキルの削除、サンプルデータに戻す) -->
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <div class="dialog-body dialog-small">
      <h2 id="confirm-title"></h2>
      <p id="confirm-message"></p>
      <div class="actions">
        <button type="button" class="btn" id="confirm-cancel">キャンセル</button>
        <button type="button" class="btn danger" id="confirm-ok">削除</button>
      </div>
    </div>
  </dialog>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
