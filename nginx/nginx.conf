# 本番の、受付(リバースプロキシ)の設定。1つのオリジン(80番)で受けて、行き先ごとに振り分ける。
#   /api、/up  → Rails(web:3000)
#   それ以外    → Next.js(frontend:3000)
# 詳しくは、docs/06-技術スタック.md の 2 章、docs/07-デプロイガイド.md を参照。
#
# サービス名(web、frontend)は、docker-compose.prod.yml のサービス名と、合わせてある。

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  # アクセスログ(コンテナの標準出力に出す。ファイルには残さない)
  log_format main '$remote_addr - [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  sendfile on;
  keepalive_timeout 65;

  # 通信量を減らす(t3.micro の、限られた帯域を、有効に使う)
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
  gzip_min_length 1024;

  # 名前を、DNS で毎回引く(Docker のコンテナは、再起動で IP が変わるため。127.0.0.11 は、Docker の内蔵 DNS)
  resolver 127.0.0.11 valid=30s;

  server {
    listen 80;
    server_name _;

    # セキュリティヘッダー(このアプリの、すべての応答に付ける。M11)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # このアプリだけが、自分自身に、img/font/style を読み込む(外部の CDN などは、使っていない)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    client_max_body_size 1m; # スキル1件の入力は、小さい(ポイント・考察でも、5000文字ほど)

    # Rails API(スキルの一覧・追加・編集・削除・移動・並べ替え)
    location /api/ {
      set $backend http://web:3000;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ヘルスチェック(Rails)
    location = /up {
      set $backend http://web:3000;
      proxy_pass $backend;
      proxy_set_header Host $host;
    }

    # それ以外は、すべて Next.js(画面)
    location / {
      set $frontend http://frontend:3000;
      proxy_pass $frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
